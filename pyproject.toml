[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-kepdco"
version = "0.1.0a2"
description = "Native LAN HRM and organization chart platform"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "PySide6==6.11.2",
]

[project.scripts]
hrm-server = "sazmanhr.server:main"
hrm-client = "sazmanhr.client:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
