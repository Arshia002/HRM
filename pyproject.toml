[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sazmanhr"
version = "16.0.7"
description = "Native LAN HRM and organization chart platform"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "PySide6>=6.7,<7",
]

[project.scripts]
sazmanhr-server = "sazmanhr.server:main"
sazmanhr-client = "sazmanhr.client:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
