name: HRM - Windows Build and Install Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/native-v49-shell
      - feat/real-data-import-v040a1
      - feat/real-data-import-v040a2
      - feat/full-v49-ui-v050a1
      - feat/production-history-web-v080rc1
      - release/v1.0.0-rc.1
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 75
    environment: real-data-validation
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HRM_CODE_SIGN_THUMBPRINT: ${{ secrets.HRM_CODE_SIGN_THUMBPRINT }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            ci/requirements-source-gates.txt
            build/windows/requirements-build.txt

      - name: Validate packaging contract
        shell: pwsh
        run: |
          & python .\ci\validate_package_contract.py --require-git-tracked 2>&1 | Tee-Object -FilePath .\ci-contract-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install source gate dependencies
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check --only-binary=:all: -r .\ci\requirements-source-gates.txt 2>&1 | Tee-Object -FilePath .\source-gate-dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate v1.0.0 rc.1 ci.2 final production candidate
        shell: pwsh
        run: |
          & python .\ci\validate_v100rc1_candidate.py 2>&1 | Tee-Object -FilePath .\candidate-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate RC network, DR and diagnostics hardening
        shell: pwsh
        run: |
          & python .\ci\validate_rc_hardening.py 2>&1 | Tee-Object -FilePath .\rc-hardening.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate protected real data
        shell: pwsh
        env:
          HRM_REAL_DATA_KEY: ${{ secrets.HRM_REAL_DATA_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path .\build-output\installer | Out-Null
          & python .\ci\validate_v060b1_real_data.py `
            --bundle .\ci\real-data\hrm-real-data-v060b1.enc `
            --output .\build-output\installer\real-data-validation-summary.json `
            2>&1 | Tee-Object -FilePath .\real-data-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build, unit test and optionally Authenticode-sign
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HRM_CODE_SIGN_THUMBPRINT)) {
            & python .\build\windows\build_windows.py
          } else {
            & python .\build\windows\build_windows.py --sign-thumbprint $env:HRM_CODE_SIGN_THUMBPRINT
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows install, login, upgrade and uninstall acceptance test
        timeout-minutes: 12
        shell: pwsh
        run: .\build\windows\smoke-install.ps1 -Installer .\build-output\installer\HRM-Setup-x64.exe -LogPath .\build-output\installer\install-test.log

      - name: Build tested v0.8.0-rc.1 source baseline for real upgrade gate
        timeout-minutes: 28
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'hrm-v080-baseline'
          git worktree add --detach $baseline 8f1adfa88a1b53db1b075504c58900957e812894
          & python (Join-Path $baseline 'build\windows\build_windows.py') 2>&1 | Tee-Object -FilePath .\v080-baseline-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force (Join-Path $baseline 'build-output\installer\HRM-Setup-x64.exe') (Join-Path $env:RUNNER_TEMP 'HRM-V080-Setup-x64.exe')
          git worktree remove --force $baseline

      - name: Reset disposable runner data before v0.8-to-v1.0-rc.1 upgrade test
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:ProgramData 'HRM-Kermanshah') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:ProgramData 'SazmanHR') -ErrorAction SilentlyContinue

      - name: Prove real v0.8.0-rc.1 to v1.0.0-rc.1 installer upgrade
        timeout-minutes: 12
        shell: pwsh
        run: .\build\windows\smoke-upgrade-from-v080.ps1 -BaselineInstaller (Join-Path $env:RUNNER_TEMP 'HRM-V080-Setup-x64.exe') -CandidateInstaller .\build-output\installer\HRM-Setup-x64.exe -LogPath .\build-output\installer\v080-to-v100rc1-upgrade.log

      - name: Generate CI manifest
        if: success()
        shell: pwsh
        run: .\ci\write-ci-manifest.ps1 -Installer .\build-output\installer\HRM-Setup-x64.exe -Output .\build-output\installer\build-manifest.json

      - name: Snapshot installer diagnostics
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $PWD 'build-output/installer'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Get-ChildItem -LiteralPath $directory -Force -ErrorAction SilentlyContinue |
            Select-Object Name,Length,LastWriteTime,Attributes |
            Format-Table -AutoSize | Out-File (Join-Path $directory 'diagnostic-files.txt') -Encoding utf8 -Force
          $dist = Join-Path $PWD 'build-output/dist'
          Get-ChildItem -LiteralPath $dist -Filter '*.exe' -Force -ErrorAction SilentlyContinue |
            Select-Object Name,Length,LastWriteTime |
            Format-Table -AutoSize | Out-File (Join-Path $directory 'frozen-executables.txt') -Encoding utf8 -Force

      - name: Upload tested installer
        uses: actions/upload-artifact@v7
        with:
          name: HRM-1.0.0-rc.1-Tested-Setup
          path: |
            build-output/installer/HRM-Setup-x64.exe
            build-output/installer/HRM-Setup-x64.exe.sha256
            build-output/installer/build-manifest.json
            build-output/installer/install-test.log
            build-output/installer/setup-inno.log
            build-output/installer/setup-upgrade.log
            build-output/installer/setup-server.log
            build-output/installer/startup-failure.log
            build-output/installer/service-config.txt
            build-output/installer/service-state.txt
            build-output/installer/service-cim.json
            build-output/installer/data-acl.txt
            build-output/installer/diagnostic-files.txt
            build-output/installer/frozen-executables.txt
            build-output/installer/dependencies.txt
            build-output/build.log
            ci-contract-validation.log
            source-gate-dependencies.log
            candidate-validation.log
            rc-hardening.log
            v080-baseline-build.log
            build-output/installer/v080-to-v100rc1-upgrade.log
            build-output/installer/v080-install.log
            build-output/installer/v100rc1-upgrade.log
            real-data-validation.log
            build-output/installer/real-data-validation-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics when build or install fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: HRM-1.0.0-rc.1-Failure-Logs
          path: |
            build-output/build.log
            ci-contract-validation.log
            source-gate-dependencies.log
            candidate-validation.log
            rc-hardening.log
            v080-baseline-build.log
            build-output/installer/v080-to-v100rc1-upgrade.log
            build-output/installer/v080-install.log
            build-output/installer/v100rc1-upgrade.log
            real-data-validation.log
            build-output/installer/real-data-validation-summary.json
            build-output/installer/*.log
            build-output/installer/*.txt
            build-output/installer/*.json
            build-output/work/*/warn-*.txt
          if-no-files-found: warn


  linux-web-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Linux web source dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Validate movement history and same-origin web API
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest tests.test_v080rc1_movements tests.test_v100rc1_operations -v
      - name: Build Linux web test package
        run: python tools/build_linux_web_test.py
      - name: Build Docker Linux web image
        run: docker build -f deploy/linux-web-test/Dockerfile -t hrm-web-test:${{ github.sha }} .
      - name: Start Docker Linux web test
        run: |
          docker run -d --name hrm-web-ci -p 127.0.0.1:18080:8080 \
            -e SAZMANHR_INITIAL_PASSWORD='LinuxWeb!CI1500pass' hrm-web-test:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health > linux-web-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/ | grep 'Linux Web Test'
      - name: Upload Linux web test package
        uses: actions/upload-artifact@v7
        with:
          name: HRM-1.0.0-rc.1-Linux-Web-Test
          path: |
            build-output/linux-web/HRM-1.0.0-rc.1-Linux-Web-Test.zip
            build-output/linux-web/HRM-1.0.0-rc.1-Linux-Web-Test.zip.sha256
            linux-web-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Docker logs on failure
        if: failure()
        run: docker logs hrm-web-ci || true
